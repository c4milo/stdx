# Decision 20: docs/costs.md is filled from one named run of this workflow per architecture, on
# the hosted runners. It runs when a person asks for it, since each run's numbers are recorded by
# hand beside the run's URL.
name: costs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  costs:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-pkg
          key: zig-pkg-${{ hashFiles('build.zig.zon') }}
      - name: Install Zig
        run: tools/install_zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Measure
        run: bench/costs/run.sh costs-report.md
      - name: Summarize
        run: cat costs-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: costs-${{ matrix.runner }}
          path: costs-report.md
