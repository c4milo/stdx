# Decision 19: every check that needs no fixed machine runs on each push to main, through
# tools/ci.sh, on both hosted runners of decision 20. A new check joins tools/ci.sh, never this
# file.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-pkg
          key: zig-pkg-${{ hashFiles('build.zig.zon') }}
      - name: Install Zig
        run: tools/install_zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Run tools/ci.sh
        run: tools/ci.sh ci-report.md
      - name: Summarize
        if: always()
        run: cat ci-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-report-${{ matrix.runner }}
          path: ci-report.md
