# A temporary probe of PSTATE.DIT on GitHub's arm64 Linux runners, which hide FEAT_DIT. The commit
# after this one restores the file. It runs tools/dit_probe.zig on the runner that stdx's CI uses
# and on the one colibri's benchmark judge uses.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dit-probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zig
        run: tools/install_zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Describe the CPU
        run: |
          lscpu || true
          echo "midr_el1=$(cat /sys/devices/system/cpu/cpu0/regs/identification/midr_el1)"
          grep -m1 Features /proc/cpuinfo
          uname -a
      - name: Probe PSTATE.DIT
        run: zig run -O ReleaseSafe tools/dit_probe.zig
