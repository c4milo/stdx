# Decisions 10 and 20: benchmarks run on the hosted runners when a person asks, pinned to one core,
# with each run recorded beside its numbers. docs/costs.md and the published results are filled
# from named runs of this workflow. The `base` input names a commit or branch to benchmark first in
# the same job, so that an A/B pairs one CPU: the x86-64 runner draws a different CPU from run to
# run (decision 20).
name: bench

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Which benchmark to run"
        type: choice
        options: [costs, deflate, checksum, profile, zstd, brotli, json, cycles]
        default: deflate
      base:
        description: "A commit, branch or tag to benchmark first, in the same job; empty for none"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so that `base` resolves any commit, branch or tag.
          fetch-depth: 0
      - name: Check the base out
        if: inputs.base != ''
        run: |
          git worktree add base "${{ inputs.base }}"
          # Zig 0.16 keeps a project's packages in zig-pkg beside its build.zig.zon and fetches any
          # that are missing there. The base uses the checkout's zig-pkg, which the cache restores,
          # in place of an empty one of its own.
          ln -s "$GITHUB_WORKSPACE/zig-pkg" base/zig-pkg
      # zig-pkg holds this project's packages and nothing else: Zig's global cache stays in its
      # default place, so no entry holds an archive or a compiled output. GitHub's cache never
      # replaces an entry, so each run's key holds the run's ID. The step restores the newest entry
      # a run kept for this build.zig.zon, or else the newest of any, so that a changed
      # build.zig.zon downloads only the packages it adds. The dash keeps the first restore key
      # from matching an entry's whole key, which the cache would prefer.
      - name: Restore the packages
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-pkg
          key: zig-pkg-${{ hashFiles('build.zig.zon') }}-${{ github.run_id }}
          restore-keys: |
            zig-pkg-${{ hashFiles('build.zig.zon') }}-
            zig-pkg-
      - name: Install Zig
        run: tools/install_zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Fetch the packages
        id: fetch
        run: |
          listed="$(ls zig-pkg 2>/dev/null || true)"
          tools/fetch_packages.sh
          # The base's packages too, so that the entry kept below holds them.
          if [ -d base ]; then (cd base && "$GITHUB_WORKSPACE/tools/fetch_packages.sh"); fi
          # A new entry when the fetch added a package, or when the entry restored holds a directory
          # of Zig's global cache, as entries kept while that cache lived in zig-pkg do.
          if [ "$(ls zig-pkg 2>/dev/null || true)" != "$listed" ] ||
            [ -n "$(ls -d zig-pkg/{b,h,o,p,tmp,z} 2>/dev/null)" ]; then
            echo "keep=true" >> "$GITHUB_OUTPUT"
          fi
      # The entry kept next holds only the packages the change's and the base's build.zig.zon name.
      - name: Prune the packages
        if: steps.fetch.outputs.keep == 'true'
        run: |
          zons=(build.zig.zon)
          if [ -d base ]; then zons+=(base/build.zig.zon); fi
          tools/prune_packages.sh "${zons[@]}"
      - name: Keep the packages
        if: steps.fetch.outputs.keep == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-pkg
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Name the step
        run: |
          case "${{ inputs.benchmark }}" in
            costs) step=costs; options="" ;;
            deflate) step=bench-deflate; options=-Doracles ;;
            checksum) step=bench-checksum; options=-Doracles ;;
            zstd) step=bench-zstd; options=-Doracles ;;
            brotli) step=bench-brotli; options=-Doracles ;;
            json) step=bench-json; options=-Doracles ;;
            cycles) step=cycles; options="" ;;
            profile)
              # perf_event_open lets a process count its own events only where the kernel allows it.
              sudo sysctl -w kernel.perf_event_paranoid=1
              step=bench-profile; options=-Doracles ;;
          esac
          echo "step=$step" >> "$GITHUB_ENV"
          echo "options=$options" >> "$GITHUB_ENV"
      - name: Sample level 5's cycles
        if: inputs.benchmark == 'cycles'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-tools-$(uname -r)" linux-tools-common || sudo apt-get install -y -qq linux-tools-azure linux-tools-common
          sudo sysctl -w kernel.perf_event_paranoid=-1
          sudo sysctl -w kernel.kptr_restrict=0
          zig build -Doracles -Drelease corpus
          stdx="--dep brotli --dep memset -Mroot=bench/l5_cycles/harness.zig --dep codec -Mbrotli=src/brotli/brotli.zig -Mcodec=src/codec/codec.zig -Mmemset=bench/timing/memset.zig"
          # stdx for the baseline CPU, as the benchmarks build it, and for the runner's CPU.
          zig build-exe -OReleaseSafe -mcpu baseline -femit-bin=l5_harness $stdx
          zig build-exe -OReleaseSafe -mcpu native -femit-bin=l5n_harness $stdx
          brotli_c=$(dirname "$(ls -d zig-pkg/*/c/enc | head -1)")
          google="-O2 -static -I$brotli_c/include bench/l5_cycles/google5.c $brotli_c/common/*.c $brotli_c/enc/*.c"
          # Google's brotli for the runner's CPU, as the benchmarks build it, and for the baseline CPU.
          zig cc -o q5_harness $google
          zig cc -mcpu=baseline -o q5b_harness $google || echo "q5b did not build"
          PERF=$(ls /usr/lib/linux-tools/*/perf | head -1)
          mkdir -p cycles
          cp l5_harness l5n_harness q5_harness cycles/
          cp q5b_harness cycles/ || true
          if [ "$(uname -m)" = x86_64 ]; then event=cpu-clock; else event=cycles; fi
          {
            echo "# level 5 cycles, $(uname -m), $(grep -m1 'model name' /proc/cpuinfo || true) $(grep -m1 -o 'Neoverse[^ ]*' /proc/cpuinfo || true)"
            echo '```text'
            # Each row's rounds, timed at that count and at twice it: the difference leaves out a
            # new process's first round, which runs on memory the kernel has not mapped yet.
            for row in "canterbury/kennedy.xls 20" "canterbury/alice29.txt 20" "canterbury/plrabn12.txt 10" "canterbury/ptt5 10" "canterbury-large/E.coli 4" "silesia/dickens 2" "silesia/mr 2" "silesia/samba 2" "silesia/webster 1" "silesia/x-ray 2" "silesia/nci 2" "http/json-1m 10"; do
              set -- $row; name=$(basename "$1"); twice=$(($2 * 2))
              for program in l5 l5n q5 q5b; do
                [ -x "./${program}_harness" ] || continue
                for rounds in "$2" "$twice"; do
                  case $program in l5*) run="./${program}_harness 5 zig-out/corpus/$1 0 $rounds" ;; *) run="./${program}_harness zig-out/corpus/$1 $rounds" ;; esac
                  echo "== $program $name $rounds"
                  "$PERF" stat -x, -r 3 -e task-clock,cycles,instructions $run 2>&1 >/dev/null | grep -E "task-clock|cycles|instructions" || true
                done
                "$PERF" record -q -e "$event" -F 10000 -o "perf-$program-$name.data" $run >/dev/null 2>&1 || true
                "$PERF" script -i "perf-$program-$name.data" -F ip 2>/dev/null | sort | uniq -c | sort -rn > "cycles/ips-$program-$name.txt" || true
                echo "$program $name: $(awk '{s+=$1} END {print s}' "cycles/ips-$program-$name.txt") samples"
              done
            done
            echo '```'
          } > bench-report.md 2>&1
      - name: Measure the base
        if: inputs.base != ''
        run: cd base && bench/run.sh "$GITHUB_WORKSPACE/base-report.md" "$step" $options
      - name: Measure
        if: inputs.benchmark != 'cycles'
        run: bench/run.sh bench-report.md "$step" $options
      - name: Summarize
        run: |
          if [ -f base-report.md ]; then
            { echo "## The base, ${{ inputs.base }}"; echo; cat base-report.md; echo; echo "## The change"; echo; } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat bench-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ inputs.benchmark }}-${{ matrix.runner }}
          path: |
            bench-report.md
            base-report.md
            cycles/
