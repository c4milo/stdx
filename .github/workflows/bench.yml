# Decisions 10 and 20: benchmarks run on the hosted runners when a person asks, pinned to one core,
# with each run recorded beside its numbers. docs/costs.md and the published results are filled
# from named runs of this workflow.
name: bench

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Which benchmark to run"
        type: choice
        options: [costs, deflate, checksum, profile, zstd, perf]
        default: deflate

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-pkg
          key: zig-pkg-${{ hashFiles('build.zig.zon') }}
      - name: Install Zig
        run: tools/install_zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Measure costs
        if: inputs.benchmark == 'costs'
        run: bench/run.sh bench-report.md costs
      - name: Measure DEFLATE
        if: inputs.benchmark == 'deflate'
        run: bench/run.sh bench-report.md bench-deflate -Doracles
      - name: Measure checksums
        if: inputs.benchmark == 'checksum'
        run: bench/run.sh bench-report.md bench-checksum -Doracles
      - name: Measure Zstandard
        if: inputs.benchmark == 'zstd'
        run: bench/run.sh bench-report.md bench-zstd -Doracles
      - name: Count cycles and branch misses
        if: inputs.benchmark == 'profile'
        run: |
          # perf_event_open lets a process count its own events only where the kernel allows it.
          sudo sysctl -w kernel.perf_event_paranoid=1
          bench/run.sh bench-report.md bench-profile -Doracles
      - name: Record where the Zstandard decoder spends its cycles
        if: inputs.benchmark == 'perf'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-tools-$(uname -r)" linux-tools-common || sudo apt-get install -y -qq linux-tools-azure linux-tools-common
          sudo sysctl -w kernel.perf_event_paranoid=-1
          sudo sysctl -w kernel.kptr_restrict=0
          tools/fetch_packages.sh
          zig build -Doracles -Drelease corpus
          zig build -Doracles
          PERF=$(ls /usr/lib/linux-tools/*/perf | head -1)
          file=zig-out/corpus/silesia/dickens
          {
            echo "# perf, $(uname -m)"
            echo '```text'
            "$PERF" stat -e cycles,instructions,branch-misses,stalled-cycles-frontend,stalled-cycles-backend,L1-dcache-load-misses,L1-dcache-loads,l2d_cache_refill,ld_align_lat,stall_backend_mem,stall_frontend,br_mis_pred_retired ./zig-out/bin/bench_profile "dickens=$file" 2>&1 | tail -30 || true
            "$PERF" record -q -o perf.data ./zig-out/bin/bench_profile "dickens=$file" >/dev/null 2>&1 || true
            "$PERF" report -i perf.data --stdio --sort symbol 2>/dev/null | head -40 || true
            "$PERF" annotate -i perf.data --stdio -s fast_sequences.fast_sequences_aarch64.execute 2>/dev/null | head -400 || true
            echo '```'
          } > bench-report.md 2>&1
      - name: Summarize
        run: cat bench-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ inputs.benchmark }}-${{ matrix.runner }}
          path: bench-report.md
