# Decisions 10 and 20: benchmarks run on the hosted runners, pinned to one core, with each run
# recorded beside its numbers. A person starts one benchmark by hand: the `base` input names a
# commit or branch to benchmark first in the same job, so that an A/B pairs one CPU, since the x86-64
# runner draws a different CPU from run to run (decision 20). On each release tag, and when a person
# names a tag in `release`, the workflow runs every job that bench/charts.txt asks for and measures
# the previous release first in each. `charts` then draws each chart with the rows that changed,
# attaches them to the release, writes them to the branch `charts`, and adds the counts to the
# release's notes (decision 85 as amended on 2026-11-26).
name: bench

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Which benchmark to run"
        type: choice
        options: [costs, deflate, checksum, profile, zstd, brotli, json, base64, regex]
        default: deflate
      base:
        description: "A commit, branch or tag to benchmark first, in the same job; empty for none"
        type: string
        default: ""
      release:
        description: "A release tag to benchmark as its push does, in place of the two inputs above; empty for none"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # The jobs to run, the tree each one measures and the tree it measures first. For a release they
  # come from bench/charts.txt and the tags (tools/bench_release.py), and the release opens with the
  # notes of docs/releases/<tag>.md (tools/charts_release.sh).
  plan:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      ref: ${{ steps.plan.outputs.ref }}
      base: ${{ steps.plan.outputs.base }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags, so that the release before the tag can be found.
          fetch-depth: 0
      - id: plan
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release }}
          BENCHMARK: ${{ inputs.benchmark }}
          BASE: ${{ inputs.base }}
        run: |
          if [ -n "$TAG" ]; then
            {
              echo "jobs=$(python3 tools/bench_release.py matrix)"
              echo "ref=$TAG"
              echo "base=$(python3 tools/bench_release.py previous "$TAG")"
              echo "tag=$TAG"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "jobs=$(python3 tools/bench_release.py matrix "$BENCHMARK")"
              echo "ref=$GITHUB_SHA"
              echo "base=$BASE"
              echo "tag="
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Open the release
        if: steps.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: tools/charts_release.sh open "${{ steps.plan.outputs.tag }}"
  bench:
    needs: plan
    name: ${{ matrix.benchmark }} ${{ matrix.job }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RUNNER_LABEL: ${{ matrix.runner }}
      BENCHMARK: ${{ matrix.benchmark }}
      BASE: ${{ needs.plan.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          # The whole history, so that the base resolves any commit, branch or tag.
          fetch-depth: 0
      - name: Check the base out
        if: env.BASE != ''
        run: |
          git worktree add base "$BASE"
          # Zig 0.16 keeps a project's packages in zig-pkg beside its build.zig.zon and fetches any
          # that are missing there. The base uses the checkout's zig-pkg, which the cache restores,
          # in place of an empty one of its own.
          ln -s "$GITHUB_WORKSPACE/zig-pkg" base/zig-pkg
      # zig-pkg holds this project's packages and nothing else: Zig's global cache stays in its
      # default place, so no entry holds an archive or a compiled output. GitHub's cache never
      # replaces an entry, so each run's key holds the run's ID. The step restores the newest entry
      # a run kept for this build.zig.zon, or else the newest of any, so that a changed
      # build.zig.zon downloads only the packages it adds. The dash keeps the first restore key
      # from matching an entry's whole key, which the cache would prefer.
      - name: Restore the packages
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-pkg
          key: zig-pkg-${{ hashFiles('build.zig.zon') }}-${{ github.run_id }}
          restore-keys: |
            zig-pkg-${{ hashFiles('build.zig.zon') }}-
            zig-pkg-
      - name: Install Zig
        run: tools/install_zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Fetch the packages
        id: fetch
        run: |
          listed="$(ls zig-pkg 2>/dev/null || true)"
          tools/fetch_packages.sh
          # The base's packages too, so that the entry kept below holds them.
          if [ -d base ]; then (cd base && "$GITHUB_WORKSPACE/tools/fetch_packages.sh"); fi
          # A new entry when the fetch added a package, or when the entry restored holds a directory
          # of Zig's global cache, as entries kept while that cache lived in zig-pkg do.
          if [ "$(ls zig-pkg 2>/dev/null || true)" != "$listed" ] ||
            [ -n "$(ls -d zig-pkg/{b,h,o,p,tmp,z} 2>/dev/null)" ]; then
            echo "keep=true" >> "$GITHUB_OUTPUT"
          fi
      # The entry kept next holds only the packages the change's and the base's build.zig.zon name.
      - name: Prune the packages
        if: steps.fetch.outputs.keep == 'true'
        run: |
          zons=(build.zig.zon)
          if [ -d base ]; then zons+=(base/build.zig.zon); fi
          tools/prune_packages.sh "${zons[@]}"
      - name: Keep the packages
        if: steps.fetch.outputs.keep == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-pkg
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Name the step
        run: |
          case "$BENCHMARK" in
            costs) step=costs; options="" ;;
            deflate) step=bench-deflate; options=-Doracles ;;
            checksum) step=bench-checksum; options=-Doracles ;;
            zstd) step=bench-zstd; options=-Doracles ;;
            brotli) step=bench-brotli; options=-Doracles ;;
            json) step=bench-json; options=-Doracles ;;
            base64) step=bench-base64; options=-Doracles ;;
            regex) step=bench-regex; options=-Doracles ;;
            profile)
              # perf_event_open lets a process count its own events only where the kernel allows it.
              sudo sysctl -w kernel.perf_event_paranoid=1
              step=bench-profile; options=-Doracles ;;
          esac
          echo "step=$step" >> "$GITHUB_ENV"
          echo "options=$options" >> "$GITHUB_ENV"
      - name: Measure the base
        if: env.BASE != ''
        run: cd base && bench/run.sh "$GITHUB_WORKSPACE/base-report.md" "$step" $options
      - name: Measure
        run: bench/run.sh bench-report.md "$step" $options
      - name: Summarize
        run: |
          if [ -f base-report.md ]; then
            { echo "## The base, $BASE"; echo; cat base-report.md; echo; echo "## The change"; echo; } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat bench-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ matrix.benchmark }}-${{ matrix.runner }}-${{ matrix.job }}
          path: |
            bench-report.md
            base-report.md
  # A release's charts, once every job of the release passed: tools/charts_release.py draws each
  # chart with the rows that changed since the previous release, and tools/charts_release.sh
  # attaches them to the release, writes them to the branch `charts` and adds the counts to the
  # release's notes. The tools come from this workflow's commit, and the reports from the release's
  # tree.
  charts:
    needs: [plan, bench]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      BASE: ${{ needs.plan.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Take the run's reports
        run: gh run download "$GITHUB_RUN_ID" --pattern 'bench-*' --dir bench-artifacts
      - name: Draw the charts
        run: python3 -I tools/charts_release.py bench-artifacts charts-out "$TAG" "$BASE"
      - name: Publish the charts
        run: tools/charts_release.sh publish charts-out "$TAG"
