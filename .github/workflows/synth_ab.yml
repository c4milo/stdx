# A temporary experiment for https://github.com/c4milo/stdx/issues/13, on a branch of its own that
# never lands: the synthetic streams decoded by each commit .github/ab/refs.txt names, built and
# timed in the same job, taking turns, on each runner CPU drawn.
name: synth-ab

on:
  push:
    branches: [perf-deflate-synth-ab]

permissions:
  contents: read

jobs:
  synth:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        draw: [1, 2, 3, 4, 5, 6]
        exclude:
          - runner: ubuntu-24.04-arm
            draw: 3
          - runner: ubuntu-24.04-arm
            draw: 4
          - runner: ubuntu-24.04-arm
            draw: 5
          - runner: ubuntu-24.04-arm
            draw: 6
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ab
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ab/zig-pkg
          key: zig-pkg-${{ hashFiles('ab/build.zig.zon') }}
      - name: Install Zig
        run: ab/tools/install_zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Build each commit
        run: python3 ab/.github/ab/synth_build.py
      - name: Generate the streams
        run: python3 ab/bench/synth/gen.py streams all
      - name: Time the commits in turns
        run: python3 ab/.github/ab/synth_run.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synth-ab-${{ matrix.runner }}-${{ matrix.draw }}
          path: synth-*.md
